name: Reusable Firebase Hosting

on:
  workflow_call:
    inputs:
      firebase-project:
        description: Firebase project ID for this repository
        required: true
        type: string
      firebase-service-account:
        description: Hosting deployer service account email
        required: true
        type: string
      firebase-target:
        description: Optional Firebase Hosting deploy target
        required: false
        default: ''
        type: string
      install-command:
        description: Dependency installation command
        required: false
        default: npm ci
        type: string
      build-command:
        description: Production build command
        required: false
        default: npm run build
        type: string
      node-version:
        description: Node.js version
        required: false
        default: '20'
        type: string
      setup-deno:
        description: Install Deno before building
        required: false
        default: false
        type: boolean
      workload-identity-provider:
        description: Google Workload Identity Federation provider resource
        required: true
        type: string

permissions:
  contents: read
  checks: write
  id-token: write
  pull-requests: write

concurrency:
  group: firebase-hosting-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - name: Install Deno
        if: inputs.setup-deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      - name: Install dependencies
        run: ${{ inputs.install-command }}
      - name: Build application
        run: ${{ inputs.build-command }}
      - name: Authenticate to Google with OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ inputs.workload-identity-provider }}
          service_account: ${{ inputs.firebase-service-account }}
      - name: Deploy Firebase preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          projectId: ${{ inputs.firebase-project }}
          target: ${{ inputs.firebase-target }}
          channelId: pr-${{ github.event.pull_request.number }}
          expires: 7d

  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - name: Install Deno
        if: inputs.setup-deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      - name: Install dependencies
        run: ${{ inputs.install-command }}
      - name: Build application
        run: ${{ inputs.build-command }}
      - name: Authenticate to Google with OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ inputs.workload-identity-provider }}
          service_account: ${{ inputs.firebase-service-account }}
      - name: Deploy Firebase live channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          projectId: ${{ inputs.firebase-project }}
          target: ${{ inputs.firebase-target }}
          channelId: live
